    <title>Qua Đèo Ngang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      <div class="hero__image" aria-hidden="true"></div>

        <p class="eyebrow">Một thoáng Đèo Ngang</p>
        <div class="rule" aria-hidden="true"></div>
        <h1 id="poem-title">Qua Đèo Ngang</h1>

        <blockquote class="poem" cite="https://vi.wikipedia.org/wiki/Qua_%C4%90%C3%A8o_Ngang">
          <p>Lom khom dưới núi, tiều vài chú</p>

        <p class="author">— Bà Huyện Thanh Quan</p>

      <p class="credit">
